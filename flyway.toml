# More information on the parameters can be found here: https://documentation.red-gate.com/flyway/reference/configuration

[environments.local]
url = "jdbc:postgresql://localhost:5552/db"
user = "user"
password = "password"
flyway.cleanDisabled = false

[flyway]
environment = "local" # It is recommended to configure environment as a commandline argument. This allows using different environments depending on the caller.
locations = ["filesystem:migrations"]
